[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breachbench"
version = "0.1.0"
description = "BreachBenchmark — a deterministic-first, closed-loop red-teaming harness for LLM safety-boundary evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bernardo Machado" }]
keywords = [
    "ai-safety", "red-teaming", "llm-evaluation", "jailbreak", "survival-analysis",
    "kaplan-meier", "benchmark", "prompt-injection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Vendor SDKs are optional so the core imports cleanly with none installed.
openai = ["openai>=1.30"]
gemini = ["google-genai>=0.3"]
groq = ["groq>=0.9"]
# Analysis stack is heavy; kept optional so the harness core stays lean.
# (lifelines pulls matplotlib, which analysis/plots.py uses for the report's KM/heatmap PNGs.)
analysis = ["lifelines>=0.27", "scipy>=1.11"]
# The slide-ready gallery in results/figures/ (scripts/make_figures.py); kaleido does the
# static PNG export.
figures = ["plotly>=6.0", "kaleido>=0.2"]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]
all = [
    "openai>=1.30",
    "google-genai>=0.3",
    "groq>=0.9",
    "lifelines>=0.27",
    "scipy>=1.11",
    "plotly>=6.0",
    "kaleido>=0.2",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/beborgesm/UC-Berkeley-Capstone_Project"
Repository = "https://github.com/beborgesm/UC-Berkeley-Capstone_Project"
Demo = "https://beborgesm.github.io/UC-Berkeley-Capstone_Project/"

[project.scripts]
breachbench-run = "breachbench.cli:run_experiment_cli"
breachbench-pilot = "breachbench.cli:pilot_cli"
breachbench-analyze = "breachbench.cli:analyze_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
